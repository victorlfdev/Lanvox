[package]
name = "lanvox"
version = "0.3.3"
edition = "2021"
description = "Voice, video, text and screen sharing over the local network"
license = "Apache-2.0"

[features]
default = ["gui"]
# The window, audio, camera and screen capture. Turn off (`--no-default-features`)
# to build only the host that runs in Docker.
gui = ["dep:eframe", "dep:egui", "dep:cpal", "dep:xcap", "dep:nokhwa", "dep:winit", "dep:rfd", "dep:if-addrs", "dep:opusic-c", "dep:sonora", "dep:wasapi", "dep:openh264", "dep:openh264-sys2", "dep:bzip2", "dep:nnnoiseless", "dep:arboard"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"], optional = true }
egui = { version = "0.37", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
crossbeam-channel = "0.5"
parking_lot = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
jpeg-encoder = { version = "0.7", features = ["simd"] }
rayon = "1.10"
cpal = { version = "0.15", optional = true }
xcap = { version = "0.7", optional = true }
nokhwa = { version = "0.10", features = ["input-native"], optional = true }
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.10"
ring = "0.17.14"
rusqlite = { version = "0.42", features = ["bundled", "backup", "blob"] }
rfd = { version = "0.18", optional = true }
if-addrs = { version = "0.15", optional = true }
snow = "0.10"
ctrlc = { version = "3.5", features = ["termination"] }
tar = { version = "0.4", default-features = false }
opusic-c = { version = "1.6.1", optional = true }
sonora = { version = "0.3", optional = true }
# Cisco's binary is loaded at run time (see src/media/openh264_runtime.rs); the
# source build is only compiled into tests.
openh264 = { version = "0.9.10", default-features = false, features = ["libloading"], optional = true }
openh264-sys2 = { version = "0.9.10", default-features = false, features = ["libloading"], optional = true }
bzip2 = { version = "0.6", optional = true }
winit = { version = "0.30", optional = true }
nnnoiseless = { version = "0.5.2", default-features = false, optional = true }
arboard = { version = "3.7", optional = true }

[dev-dependencies]
openh264 = { version = "0.9.10", features = ["source"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_System_DataExchange", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_System_Threading"] }
wasapi = { version = "0.27", optional = true }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_System_Com_Urlmon", "Win32_Networking_WinInet", "Foundation", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[patch.crates-io]
nokhwa-bindings-windows = { path = "vendor/nokhwa-bindings-windows" }
